<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خمّن الكلمة</title>
<style>
:root { --page:#f4f2ef; --ink:#23272f; --ink2:#6b7280; --hair:#e6e3de; --green:#66bb6a; --amber:#fb8c00; --gray:#9aa0a8; }
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--page); }
body {
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,"Noto Kufi Arabic","Noto Sans Arabic",Arial,sans-serif;
    color:var(--ink); display:flex; justify-content:center;
}
.card { max-width:480px; width:100%; background:#fff; min-height:100vh; padding:16px 12px 26px; box-shadow:0 0 24px rgba(20,25,40,.06); }
h1 { text-align:center; font-size:27px; margin:6px 0 2px; }
.sub { text-align:center; font-size:13px; color:var(--ink2); margin-bottom:10px; }
.stats { display:flex; gap:8px; margin-bottom:10px; }
.chip { flex:1; border:1px solid var(--hair); border-radius:14px; padding:6px 4px; text-align:center; }
.chip b { display:block; font-size:18px; line-height:1.25; }
.chip span { font-size:11px; color:var(--ink2); }
.modeline { text-align:center; font-size:12px; color:var(--ink2); margin-bottom:8px; min-height:16px; }
.clueline { text-align:center; font-size:13px; background:#f9f7f2; border:1px solid var(--hair); border-radius:12px; padding:7px 10px; margin-bottom:8px; line-height:1.7; }
.pattern { display:flex; gap:8px; direction:rtl; justify-content:center; margin-bottom:10px; }
.pcell { width:34px; height:38px; border-bottom:3px solid #c9c4ba; display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:700; color:#b9b4ac; }
.pcell.on { border-color:var(--green); color:var(--ink); }
.btn:disabled { opacity:.45; }
.board { display:flex; flex-direction:column; gap:6px; align-items:center; margin-bottom:12px; }
.wrow { display:flex; gap:6px; direction:rtl; }
.cell {
    width:64px; height:64px; border:2px solid var(--hair); border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    font-size:30px; font-weight:700; background:#fff;
    transition:background .25s, border-color .25s, transform .25s;
}
.cell.cur { border-color:#b9b4ac; }
.cell.flip { animation:flip .45s ease; }
@keyframes flip { 50% { transform:rotateX(90deg); } }
.cell.green { background:var(--green); border-color:var(--green); color:#fff; }
.cell.amber { background:var(--amber); border-color:var(--amber); color:#fff; }
.cell.gray { background:var(--gray); border-color:var(--gray); color:#fff; }
.wrow.shake { animation:shake .4s ease; }
@keyframes shake { 25% { transform:translateX(5px); } 50% { transform:translateX(-5px); } 75% { transform:translateX(3px); } }
.kbd { display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
.krow { display:flex; gap:4px; direction:rtl; justify-content:center; }
.key {
    flex:1; max-width:44px; height:50px; border:1px solid var(--hair); border-radius:8px;
    background:#f1eee9; font-family:inherit; font-size:17px; font-weight:600; color:var(--ink); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:background .2s;
}
.key:active { transform:scale(.94); }
.key.wide { max-width:64px; font-size:13px; }
.key.green { background:var(--green); border-color:var(--green); color:#fff; }
.key.amber { background:var(--amber); border-color:var(--amber); color:#fff; }
.key.gray { background:var(--gray); border-color:var(--gray); color:#fff; }
.controls { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:6px; }
.btn {
    font-family:inherit; font-size:15px; padding:10px 16px; border-radius:12px;
    border:1px solid var(--hair); background:#fff; color:var(--ink); cursor:pointer;
}
.btn:active { transform:scale(.97); }
.btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700; }
.hintline { text-align:center; font-size:12.5px; color:var(--ink2); margin-top:10px; line-height:1.8; }
.overlay {
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(244,242,239,.8); backdrop-filter:blur(3px); z-index:40; padding:14px;
}
.panel {
    background:#fff; border:1px solid var(--hair); border-radius:18px; padding:18px 22px;
    text-align:center; box-shadow:0 12px 32px rgba(20,25,40,.14);
    display:flex; flex-direction:column; gap:9px; min-width:250px; max-width:92%;
}
.panel .t { font-size:22px; font-weight:700; }
.panel .w { font-size:30px; font-weight:800; letter-spacing:2px; }
.panel .d { font-size:13px; color:var(--ink2); line-height:1.8; }
.panel .cd { font-size:15px; font-weight:700; color:var(--ink); direction:ltr; }
.toast {
    position:fixed; top:14px; right:50%; transform:translateX(50%);
    background:var(--ink); color:#fff; border-radius:10px; padding:9px 16px; font-size:13.5px;
    z-index:60; opacity:0; transition:opacity .25s; pointer-events:none;
}
.toast.on { opacity:1; }
body.fs-pseudo { overflow:hidden; }
body.fs-pseudo .card { position:fixed; inset:0; max-width:none; z-index:999; overflow-y:auto; min-height:0; }
.card:fullscreen { max-width:none; overflow-y:auto; }
@media (max-width:380px) { .cell { width:56px; height:56px; font-size:26px; } .key { font-size:15px; height:46px; } }
</style>
</head>
<body>
<div class="card">
    <h1>خمّن الكلمة</h1>
    <div class="sub">كلمة عربية من ٤ حروف و٨ محاولات، مع تلميح وحروف دليلية. كلمة جديدة كل يوم!</div>
    <div class="stats">
        <div class="chip"><b id="uiPlayed">0</b><span>لعبت</span></div>
        <div class="chip"><b id="uiWon">0</b><span>فزت</span></div>
        <div class="chip"><b id="uiStreak">0</b><span>السلسلة</span></div>
        <div class="chip"><b id="uiMax">0</b><span>أفضل سلسلة</span></div>
    </div>
    <div class="modeline" id="modeLine"></div>
    <div class="clueline" id="clueLine"></div>
    <div class="pattern" id="pattern"></div>
    <div class="board" id="board"></div>
    <div class="kbd" id="kbd"></div>
    <div class="controls">
        <button type="button" class="btn" id="btnMute">🔊 الصوت</button>
        <button type="button" class="btn" id="btnFs">⛶ ملء الشاشة</button>
        <button type="button" class="btn" id="btnHint">💡 حرف (٢)</button>
        <button type="button" class="btn" id="btnPractice">🎯 تدريب</button>
    </div>
    <div class="hintline">🟩 الحرف صحيح وفي مكانه · 🟨 موجود بمكان آخر · ⬜ غير موجود<br>التخمين بكلمات عربية حقيقية فقط، والكلمة غير الموجودة لا تخسرك محاولة!</div>
</div>
<div class="overlay" id="ovEnd" style="display:none">
    <div class="panel">
        <div class="t" id="endTitle">🎉 أحسنت!</div>
        <div class="w" id="endWord"></div>
        <div class="d" id="endDetail"></div>
        <div class="d">كلمة الغد بعد:</div>
        <div class="cd" id="endCount">--:--:--</div>
        <button type="button" class="btn primary" id="btnShare">📋 انسخ النتيجة</button>
        <button type="button" class="btn" id="btnPractice2">🎯 جولة تدريب</button>
        <button type="button" class="btn" id="btnClose">إغلاق</button>
    </div>
</div>
<div class="toast" id="toast"></div>

function audio() {
    if (muted) return null;

    var ctx = audio(); if (!ctx) return;

    g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + 0.05);
}

    {w:'شبكة',c:'يصطاد بها'},{w:'جناح',c:'يطير به الطير'},{w:'فطور',c:'وجبة الصباح'},{w:'سحور',c:'وجبة قبل الفجر'},{w:'زفاف',c:'حفل الزواج'},
    {w:'قلاع',c:'حصون قديمة'},{w:'حقول',c:'أراضي الزرع'},{w:'نجوم',c:'تلمع ليلاً'},{w:'صقور',c:'طيور جارحة'},{w:'خيول',c:'تعدو بسرعة'},
    {w:'فهود',c:'أسرع العواشر'},{w:'خروف',c:'ذبيحة العيد'},{w:'ماعز',c:'من المواشي'},{w:'بقرة',c:'تدر الحليب'},{w:'جملة',c:'مجموعة كلمات مفيدة'},
    {w:'فقرة',c:'جزء من نص'},{w:'كلمة',c:'وحدة الكلام'},{w:'قلمي',c:'خاص بالقلم'},{w:'صفحة',c:'وجه من الكتاب'},{w:'غلاف',c:'يحمي الكتاب'},
    {w:'فهرس',c:'قائمة المحتويات'}
];
// fix: keep only normalized-5 unique entries (validated at build time)
function norm(w) {
    return w.replace(/[أإآ]/g, 'ا').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي');
}
WORDS = (function () {
    var seen = {}, out = [];
    WORDS.forEach(function (e) {
        var n = norm(e.w);
        if (n.length === 4 && !seen[n]) { seen[n] = 1; out.push({ w: n, c: e.c }); }
    });
    return out;
})();
var VALID = {};
WORDS.forEach(function (e) { VALID[e.w] = 1; });
var EXTRA_GUESSES = ['بنات','بيوت','تراث','تسوق','تمور','جانب','جليد','حاجة','حاضر','حريم','حيلة','خريف','خضار','خيال','دماغ','دمعة','دهشة','ربيع','رجال','رغبة','رملة','رياح','زكاة','زمان','سايق','سراب','سيول','شاطي','شباب','شيوخ','صدقة','صقيع','صلاة','ضباب','طيور','ظلام','عادة','عتمة','عيال','غبار','غيرة','غيوم','فرحة','فطنة','قاري','قبلة','لمحة','لهفة','لولو','ماضي','مدار','مكان','ملمس','مواد','نبات','نخوة','نساء','نسيم','نصيب','نظام','نظرة','نعيم','هبوب','همسة','هناء','واقع','ورود'];
EXTRA_GUESSES.forEach(function (w) { VALID[norm(w)] = 1; });

// ---------- day / word ----------
var KWT = 3 * 3600e3;
function todayIndex() { return Math.floor((Date.now() + KWT) / 86400e3); }
function dailyEntry() { return WORDS[todayIndex() % WORDS.length]; }

// ---------- state ----------
var ROWS = 8, COLS = 4;
var mode = 'daily'; // daily | practice
var solution = '', clue = '', guesses = [], cur = '', status = 'playing'; // playing | won | lost
var revealed = [], hintLeft = 2;
var keyState = {}; // letter -> 'green'|'amber'|'gray' (best)
var board = document.getElementById('board'), kbd = document.getElementById('kbd');
var modeLine = document.getElementById('modeLine');

var KB_ROWS = [
    ['ض', 'ص', 'ث', 'ق', 'ف', 'غ', 'ع', 'ه', 'خ', 'ح', 'ج', 'د'],
    ['ش', 'س', 'ي', 'ب', 'ل', 'ا', 'ت', 'ن', 'م', 'ك', 'ط'],
    ['دخول', 'ئ', 'ء', 'ؤ', 'ر', 'ى', 'ة', 'و', 'ز', 'ظ', '⌫']
];

function buildBoard() {
    board.innerHTML = '';
    for (var r = 0; r < ROWS; r++) {
        var row = document.createElement('div');
        row.className = 'wrow';
        for (var c = 0; c < COLS; c++) {
            var cell = document.createElement('div');
            cell.className = 'cell';
            cell.id = 'c' + r + '-' + c;
            row.appendChild(cell);
        }
        board.appendChild(row);
    }
}
function buildKbd() {
    kbd.innerHTML = '';
    KB_ROWS.forEach(function (row) {
        var r = document.createElement('div');
        r.className = 'krow';
        row.forEach(function (k) {
            var b = document.createElement('button');
            b.type = 'button';
            b.className = 'key' + (k === 'دخول' || k === '⌫' ? ' wide' : '');
            b.textContent = k;
            b.id = 'k-' + k;
            b.addEventListener('click', function () { press(k); });
            r.appendChild(b);
        });
        kbd.appendChild(r);
    });
}

function grade(guess, sol) {
    // two-pass: greens first, then ambers limited by remaining letter counts
    var res = [];
    var left = {};
    for (var i = 0; i < COLS; i++) res.push('gray');
    for (var i = 0; i < COLS; i++) {
        if (guess[i] === sol[i]) res[i] = 'green';
        else left[sol[i]] = (left[sol[i]] || 0) + 1;
    }
    for (var j = 0; j < COLS; j++) {
        if (res[j] === 'green') continue;
        if (left[guess[j]] > 0) { res[j] = 'amber'; left[guess[j]]--; }
    }
    return res;
}

function renderRow(r, animate) {
    var g = guesses[r];
    var grades = grade(norm(g), solution);
    for (var c = 0; c < COLS; c++) {
        (function (cell, cls, delay) {
            setTimeout(function () {
                if (animate) cell.classList.add('flip');
                cell.classList.add(cls);
            }, animate ? delay : 0);
        })(document.getElementById('c' + r + '-' + c), grades[c], c * 220);
    }
    // keyboard colors (best wins)
    setTimeout(function () {
        var n = norm(g);
        for (var c2 = 0; c2 < COLS; c2++) {
            var L = n[c2], cls = grades[c2];
            var rank = { gray: 1, amber: 2, green: 3 };
            if (!keyState[L] || rank[cls] > rank[keyState[L]]) keyState[L] = cls;
            var keyEl = document.getElementById('k-' + g[c2]);
            if (keyEl) {
                keyEl.classList.remove('green', 'amber', 'gray');
                keyEl.classList.add(keyState[L]);
            }
        }
    }, animate ? 4 * 220 + 200 : 0);
}

function renderCurrent() {
    for (var c = 0; c < COLS; c++) {
        var cell = document.getElementById('c' + guesses.length + '-' + c);
        if (!cell) return;
        cell.textContent = cur[c] || '';
        cell.classList.toggle('cur', !!cur[c]);
    }
}
function restoreGuesses() {
    for (var r = 0; r < guesses.length; r++) {
        var g = guesses[r];
        for (var c = 0; c < COLS; c++) document.getElementById('c' + r + '-' + c).textContent = g[c];
        renderRow(r, false);
    }
}

function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('on');
    setTimeout(function () { t.classList.remove('on'); }, 1600);
}

function saveDaily() {
    if (mode === 'daily') lsSet('desert-word.daily.v2', { day: todayIndex(), guesses: guesses, status: status, revealed: revealed, hintLeft: hintLeft });
}
function syncStats() {
    document.getElementById('uiPlayed').textContent = String(stats.played);
    document.getElementById('uiWon').textContent = String(stats.won);
    document.getElementById('uiStreak').textContent = String(stats.streak);
    document.getElementById('uiMax').textContent = String(stats.max);
    modeLine.textContent = mode === 'practice' ? '🎯 جولة تدريب — لا تؤثر على إحصائياتك' : '';
}

function submit() {
    if (status !== 'playing') return;
    if (cur.length < COLS) {
        var row = board.children[guesses.length];
        if (row) { row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }
        toast('أكمل الحروف الخمسة');
        return;
    }
    if (!VALID[norm(cur)]) {
        var badRow = board.children[guesses.length];
        if (badRow) { badRow.classList.remove('shake'); void badRow.offsetWidth; badRow.classList.add('shake'); }
        toast('الكلمة غير موجودة في قائمتنا، جرب أخرى');
        return;
    }
    sSubmit();
    guesses.push(cur);
    renderRow(guesses.length - 1, true);
    var n = norm(cur);
    cur = '';
    if (n === solution) {
        status = 'won';
        if (mode === 'daily') {
            stats.played++; stats.won++; stats.streak++;
            if (stats.streak > stats.max) stats.max = stats.streak;
            lsSet('desert-word.stats.v1', stats);
        }
        sWin();
        setTimeout(function () { endOverlay(true); }, 1300);
    } else if (guesses.length >= ROWS) {
        status = 'lost';
        if (mode === 'daily') {
            stats.played++; stats.streak = 0;
            lsSet('desert-word.stats.v1', stats);
        }
        sLose();
        setTimeout(function () { endOverlay(false); }, 1300);
    }
    saveDaily();
    syncStats();
    renderCurrent();
    syncHint();
}

function press(k) {
    if (status !== 'playing') return;
    if (k === '⌫') { cur = cur.slice(0, -1); sKey(); renderCurrent(); return; }
    if (k === 'دخول') { submit(); return; }
    if (cur.length >= COLS) return;
    audio();
    sKey();
    cur += k;
    renderCurrent();
}
window.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { submit(); e.preventDefault(); return; }
    if (e.key === 'Backspace') { cur = cur.slice(0, -1); renderCurrent(); e.preventDefault(); return; }
    if (/^[\u0621-\u064A]$/.test(e.key)) press(e.key);
});

// ---------- hint letters ----------
function seedPos(d) { return (d * 3 + 1) % COLS; } // deterministic free letter for the daily word
function renderPattern() {
    var p = document.getElementById('pattern');
    p.innerHTML = '';
    for (var i = 0; i < COLS; i++) {
        var d = document.createElement('div');
        var on = revealed.indexOf(i) >= 0;
        d.className = 'pcell' + (on ? ' on' : '');
        d.textContent = on ? solution[i] : 'ـ';
        p.appendChild(d);
    }
}
function syncHint() {
    var b = document.getElementById('btnHint');
    b.textContent = '💡 حرف (' + hintLeft + ')';
    b.disabled = status !== 'playing' || hintLeft <= 0 || revealed.length >= COLS;
}
function useHint() {
    if (status !== 'playing' || hintLeft <= 0 || revealed.length >= COLS) return;
    var pool = [];
    for (var i = 0; i < COLS; i++) if (revealed.indexOf(i) < 0) pool.push(i);
    revealed.push(pool[(Math.random() * pool.length) | 0]);
    hintLeft--;
    sKey();
    renderPattern();
    syncHint();
    saveDaily();
    toast('انكشف حرف جديد في الأعلى');
}
document.getElementById('btnHint').addEventListener('click', useHint);

// ---------- end overlay / countdown / share ----------
var cdTimer = null;
function msToNextDay() {
    var t = Date.now() + KWT;
    return (Math.floor(t / 86400e3) + 1) * 86400e3 - KWT - Date.now();
}
function tickCountdown() {
    var ms = msToNextDay(), s = Math.floor(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    document.getElementById('endCount').textContent =
        String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
}
function endOverlay(wonGame) {
    if (mode === 'practice') {
        document.getElementById('endTitle').textContent = wonGame ? '🎉 أحسنت!' : '😅 انتهت الجولة';
        document.getElementById('endWord').textContent = solution;
        document.getElementById('endDetail').textContent = wonGame ?
            'حللت كلمة التدريب في ' + guesses.length + ' من ٨ محاولات.' : 'الكلمة كانت كما ترى. جرب كلمة اليوم!';
        document.getElementById('endCount').textContent = '';
    } else {
        document.getElementById('endTitle').textContent = wonGame ? '🎉 أحسنت!' : '😅 حظ أوفر غداً';
        document.getElementById('endWord').textContent = solution;
        document.getElementById('endDetail').textContent = wonGame ?
            'حللت كلمة اليوم #' + (todayIndex() % WORDS.length + 1) + ' في ' + guesses.length + ' من ٨ محاولات.' :
            'لم تنجح هذه المرة. السلسلة رجعت للصفر، غداً يوم جديد!';
        tickCountdown();
        clearInterval(cdTimer);
        cdTimer = setInterval(tickCountdown, 1000);
    }
    document.getElementById('ovEnd').style.display = 'flex';
}
function shareText() {
    var day = todayIndex() % WORDS.length + 1;
    var head = 'خمّن الكلمة #' + day + ' — ' + (status === 'won' ? guesses.length : 'X') + '/8';
    var lines = guesses.map(function (g) {
        return grade(norm(g), solution).map(function (c) { return c === 'green' ? '🟩' : c === 'amber' ? '🟨' : '⬜'; }).join('');
    });
    return head + '\n' + lines.join('\n');
}
document.getElementById('btnShare').addEventListener('click', function () {
    var text = shareText();
    function done() { sKey(); toast('نُسخت النتيجة! الصقها أين تريد'); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else fallback();
    function fallback() {
        try {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed'; ta.style.opacity = '0';
            document.body.appendChild(ta); ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            done();
        } catch (e) { toast('تعذر النسخ على هذا المتصفح'); }
    }
});
document.getElementById('btnClose').addEventListener('click', function () {
    sKey();
    document.getElementById('ovEnd').style.display = 'none';
});

// ---------- modes ----------
function startDaily() {
    mode = 'daily';
    var e = dailyEntry();
    solution = e.w; clue = e.c;
    guesses = []; cur = ''; status = 'playing'; keyState = {};
    revealed = [seedPos(todayIndex()), (seedPos(todayIndex()) + 2) % COLS]; hintLeft = 4;
    if (daily && daily.day === todayIndex()) {
        guesses = daily.guesses || [];
        status = daily.status || 'playing';
        if (daily.revealed && daily.revealed.length) revealed = daily.revealed;
        if (typeof daily.hintLeft === 'number') hintLeft = daily.hintLeft;
    }
    document.getElementById('clueLine').textContent = '💡 ' + clue;
    buildBoard(); buildKbd();
    restoreGuesses();
    renderCurrent();
    renderPattern();
    syncHint();
    if (status !== 'playing') setTimeout(function () { endOverlay(status === 'won'); }, 600);
    syncStats();
}
function startPractice() {
    sKey();
    mode = 'practice';
    var e = WORDS[(Math.random() * WORDS.length) | 0];
    solution = e.w; clue = e.c;
    guesses = []; cur = ''; status = 'playing'; keyState = {};
    var p1 = (Math.random() * COLS) | 0, p2 = (p1 + 1 + ((Math.random() * (COLS - 1)) | 0)) % COLS;
    revealed = [p1, p2]; hintLeft = 4;
    document.getElementById('clueLine').textContent = '💡 ' + clue;
    document.getElementById('ovEnd').style.display = 'none';
    clearInterval(cdTimer);
    buildBoard(); buildKbd();
    renderCurrent();
    renderPattern();
    syncHint();
    syncStats();
}
document.getElementById('btnPractice').addEventListener('click', function () {
    if (mode === 'practice') { startDaily(); sKey(); }
    else startPractice();
});
document.getElementById('btnPractice2').addEventListener('click', startPractice);
function syncPracticeLabel() {
    document.getElementById('btnPractice').textContent = mode === 'practice' ? '📅 كلمة اليوم' : '🎯 تدريب';
}
setInterval(syncPracticeLabel, 400);

// ---------- mute / fullscreen ----------
function syncMute() { document.getElementById('btnMute').textContent = muted ? '🔇 الصوت' : '🔊 الصوت'; }
document.getElementById('btnMute').addEventListener('click', function () {
    muted = !muted;
    lsSet('desert-word.muted.v1', muted);
    syncMute();
    if (!muted) sKey();
});
function isFs() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
function pseudoFs() { return document.body.classList.contains('fs-pseudo'); }
function syncFs() {
    document.getElementById('btnFs').textContent = (isFs() || pseudoFs()) ? '✕ خروج' : '⛶ ملء الشاشة';
}
function pseudoSet(on) { document.body.classList.toggle('fs-pseudo', on); syncFs(); }
function toggleFs() {
    sKey();
    if (pseudoFs()) { pseudoSet(false); return; }
    if (isFs()) {
        try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) { /* ignore */ }
        return;
    }
    var card = document.querySelector('.card');
    var ok = false;
    try {
        if (card.requestFullscreen) {
            var r = card.requestFullscreen();
            ok = true;
            if (r && r.catch) r.catch(function () { pseudoSet(true); });
        } else if (card.webkitRequestFullscreen) { card.webkitRequestFullscreen(); ok = true; }
    } catch (e) { ok = false; }
    if (!ok) pseudoSet(true);
    else setTimeout(function () { if (!isFs() && !pseudoFs()) pseudoSet(true); }, 600);
    syncFs();
}
document.getElementById('btnFs').addEventListener('click', toggleFs);
document.addEventListener('fullscreenchange', syncFs);
document.addEventListener('webkitfullscreenchange', syncFs);

// test hook (harmless): deterministic checks for automated play-testing
window.__wordTest = {
    state: function () { return { mode: mode, status: status, rows: guesses.length, cur: cur, day: todayIndex(), words: WORDS.length }; },
    solution: function () { return solution; },
    type: function (w) { for (var i = 0; i < w.length; i++) press(w[i]); },
    enter: function () { submit(); },
    practice: function () { startPractice(); },
    gradeOf: function (g) { return grade(norm(g), solution); },
    hint: function () { useHint(); },
    valid: function (w) { return !!VALID[norm(w)]; },
    hintInfo: function () { return { revealed: revealed.slice(), left: hintLeft, clue: clue, sol: solution }; }
};

buildBoard();
buildKbd();
startDaily();
syncMute();
syncFs();

})();
</script>
